  - reference:
      "I had the pleasure of working closely with Telmo on several high-impact projects, and I can confidently say that he is one of the most talented and driven Senior Software Engineers I’ve encountered. His technical expertise is matched only by his problem-solving mindset and commitment to delivering top-notch solutions.<br>
      Telmo has an exceptional ability to break down complex problems and design scalable, efficient systems. His proficiency in a wide range of technologies, combined with a deep understanding of software architecture, consistently resulted in robust and maintainable code. He doesn’t just write code – he engineers thoughtful, innovative solutions that align with business goals.<br>
      One of Telmo’s standout qualities is his leadership within the team. He not only mentors junior developers with patience and clarity but also fosters an environment of collaboration and continuous learning. His ability to communicate complex technical concepts in a clear, understandable way makes him a valuable resource for both technical and non-technical stakeholders.<br>
      Telmo’s dedication to quality is evident in every aspect of his work, from testing to deployment. He approaches challenges with a calm, analytical mindset, and his solutions are always future-proofed and thoroughly considered.<br>
      If you’re looking for a software engineer who combines technical excellence, leadership, and a collaborative spirit, Telmo is a perfect fit. I would highly recommend him for any senior engineering role – he’ll be an invaluable asset to any team."
